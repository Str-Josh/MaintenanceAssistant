{% extends "layouts/nav.html" %}
{% block content %}

<head>
    <title>{{ user.username }}'s Profile</title>
</head>

<div>
    {% if user.first_name and user.last_name %}
        <p>{{ user.first_name }} {{ user.last_name }}</p>
    {% else %}
        <p>{{ user.username }}</p>
    {% endif %}
    <p>{{ user.email }}</p>
    
</div>

    <p>{{ user.role }}</p>
</div> -->

{% endblock %}
