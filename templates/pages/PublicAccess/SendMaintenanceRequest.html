{% extends "layouts/nav.html" %}
{% block content %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Request Submission</title>
    <!-- <title>Document</title> -->
    
    <link rel="stylesheet" href="/static/pages/PublicAccess/SendMaintenanceRequest_styles.css">
    <link rel="stylesheet" href="/static/pages/stylesheet.css">
    <!-- <link rel="icon" type="image/png" href="static/img/logo.png"> -->
</head>
<body class="wholepage">
    <div class="truebody">
    <div class="request subheader">
        <h1 class="title">
            Send Request
        </h1>
    </div>

    <form class="form" action="/send-request" method="post">
        <!-- <div class="request subheader"> -->
        <div class="sendRequestForm">
            <div">
                <label for="urgencyCheck" class="labeltext">Level of urgency</label>
                <div>
                    <input type="checkbox" name="casual" />
                    <label for="casual">Casual</label>
                    <input type="checkbox" name="urgent" />
                    <label for="urgent">Urgent</label>
                </div>
            </div>
    
            {% if success_message %}
                <h2 style="align-items: center;font-size: large;">{{ success_message }}</h2>
            {% else %}
            {% endif %}
    
            <div class="subjectClass">
                <!-- <label for="subject" class="subjectText">Subject:</label>
                <input type="text" id="subject" name="subject" class="subjectBox"> -->
                <label for="DOI" class="labeltext">Device Generic Name</label>
                <input type="text" class="inputBox" name="DOI" />
            </div>
            <div class="dateClass">
                <label for="date" class="labelText dateText">Date:</label>
                <input type="date" id="date" name="date" class="inputBox">
            </div>
            <div class="messageClass">
                <label for="message" class="labelText">Optional Detailed Message:</label>
                <textarea type="message" id="message" name="message" class="bigBox"></textarea>
            </div>
    
            <button type="submit" class="submitButton">Send Maintenance Request</button>
        </div>
    </form>

</body>

{% endblock %}
