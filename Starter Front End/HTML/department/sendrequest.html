<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/Starter Front End/CSS/stylesheet.css">
</head>
<header>
    <button onclick="location.href='/Starter Front End/HTML/department/DepartmentHome.html'" class="returnHome">
        Return Home
    </button>
    <img src="/Starter Front End/images/logo.png">
    <h1>Project 3 Temporary Name</h1>
    <h1>Department</h1>
    <a href="/Starter Front End/HTML/login.html"><img src="/Starter Front End/images/Logout.png"></a>
</header>
<body>
    <div class="request subheader">
        <h1 class="title">
            Send Request
        </h1>
    </div>

    <form class="container">
        <div class="subjectClass">
            <label for="subject" class="subjectText"><h4>Subject:</h4></label>
            <input type="text" id="subject" name="subject" class="subjectBox">
        </div>
        <div class="dateClass">
            <label for="date" class="dateText"><h4>Date:</h4></label>
            <input type="date" id="date" name="date" class="dateBox">
        </div>
        <div class="messageClass">
            <label for="message" class="messageText"><h4>Message:</h4></label>
            <input type="message" id="message" name="message" class="messageBox">
        </div>
        <div class="gapClass"></div>
        <input type="submit" value="Submit" class="submitbutton buttonClass">
    </form>
</body>
</html>
